services:
  # EveWatch Unified Full-Stack Quantum Cybersecurity Platform
  - type: web
    name: evewatch
    runtime: python
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: IBM_QUANTUM_TOKEN
        sync: false
